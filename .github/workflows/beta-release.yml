name: Publish beta release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/beta-release.yml']
    tags:
      - 'beta[0-9]*'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'beta1.0.2' }}

concurrency:
  group: release-${{ github.ref_type == 'tag' && github.ref_name || 'beta1.0.2' }}
  cancel-in-progress: true

jobs:
  windows-x64:
    if: ${{ false }}
    name: Build and publish Windows x64
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64

      - name: Build and test
        run: |
          function Invoke-ReleaseCheck($label, $tool, $arguments) {
            $output = & $tool @arguments 2>&1
            $code = $LASTEXITCODE
            $output | ForEach-Object { Write-Host $_ }
            if ($code -ne 0) {
              $detail = ($output | Select-Object -Last 24) -join '%0A'
              Write-Host "::error title=${label}::$detail"
              exit $code
            }
          }
          Invoke-ReleaseCheck 'Configure Windows' cmake @('-S', '.', '-B', 'out', '-G', 'Visual Studio 17 2022', '-A', 'x64', "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR")
          Invoke-ReleaseCheck 'Compile Windows' cmake @('--build', 'out', '--config', 'Release', '--parallel', '2')
          Invoke-ReleaseCheck 'Test Windows' ctest @('--test-dir', 'out', '-C', 'Release', '--output-on-failure')

      - name: Stage and verify Windows package
        run: |
          try {
            $PSNativeCommandUseErrorActionPreference = $false
            $packageRoot = Join-Path $PWD.Path 'package'
            $output = & cmake --install out --config Release --prefix $packageRoot 2>&1
            $code = $LASTEXITCODE
            $output | ForEach-Object { Write-Host $_ }
            if ($code -ne 0) { throw (($output | Select-Object -Last 22) -join '%0A') }
            Copy-Item out/Release/ldfcl-cli.exe package/bin/
            Copy-Item README.md,LICENSE package/
            Copy-Item out/_deps/nlohmann_json-src/LICENSE.MIT package/share/licenses/LDFCL/nlohmann-json-LICENSE
            Copy-Item out/_deps/miniz-src/LICENSE package/share/licenses/LDFCL/miniz-LICENSE
            Copy-Item docs/Qt-LGPL.md package/share/licenses/LDFCL/
            Copy-Item docs/licenses/*.txt package/share/licenses/LDFCL/
            foreach ($file in 'LDFCL.exe', 'Qt6Core.dll', 'qwindows.dll') {
              if (-not (Get-ChildItem package -Recurse -File -Filter $file)) {
                throw "Missing deployment file: $file"
              }
            }
          } catch {
            $detail = $_.Exception.Message -replace '\r?\n', '%0A'
            Write-Host "::error title=Stage Windows package::$detail"
            exit 1
          }

      - name: Compile and test the Windows installer
        run: |
          try {
            $packageRoot = Join-Path $PWD.Path 'package'
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
            $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            $redist = Get-ChildItem (Join-Path $vs 'VC/Redist/MSVC') -Directory |
              ForEach-Object { Join-Path $_.FullName 'x64/Microsoft.VC143.CRT' } |
              Where-Object { Test-Path $_ } | Sort-Object -Descending | Select-Object -First 1
            if (-not $redist) { throw 'Visual C++ runtime redistributables are missing' }
            Copy-Item "$redist/*.dll" package/bin/
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
            if (-not (Test-Path $iscc)) {
              choco install innosetup --no-progress -y
              if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup' }
            }
            $entryRoot = Join-Path $PWD.Path 'out/Release'
            $output = & $iscc "/DReleaseTag=$env:RELEASE_TAG" "/DSourceRoot=$packageRoot" "/DEntryRoot=$entryRoot" "/DOutputRoot=$($PWD.Path)" packaging/LDFCL.iss 2>&1
            $code = $LASTEXITCODE
            $output | ForEach-Object { Write-Host $_ }
            if ($code -ne 0) { throw (($output | Select-Object -Last 24) -join '%0A') }

            $setup = "LDFCL-${env:RELEASE_TAG}-Windows-x64-Setup.exe"
            $appRoot = Join-Path $env:RUNNER_TEMP 'LDFCL Install Test'
            $previous = Join-Path $env:RUNNER_TEMP 'PCL Fixture'
            $gameRoot = Join-Path $previous '.minecraft'
            New-Item (Join-Path $gameRoot 'versions') -ItemType Directory -Force | Out-Null
            $registry = 'HKCU:\Software\LDFCL\LDFCL'
            $fixtureVersion = Join-Path $gameRoot 'versions/fixture'
            New-Item $fixtureVersion -ItemType Directory -Force | Out-Null
            Set-Content (Join-Path $fixtureVersion 'fixture.json') -Encoding ascii '{"mainClass":"fixture.Main","libraries":[]}'
            Set-Content (Join-Path $fixtureVersion 'fixture.jar') -Encoding ascii 'Fixture client'
            $setupArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="{0}"' -f $appRoot))
            $install = Start-Process (Join-Path $PWD.Path $setup) -ArgumentList $setupArgs -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "Fresh install exited with code $($install.ExitCode)" }
            $fresh = (Get-ItemProperty $registry).gameDirectory
            if ($fresh -ne (Join-Path $env:LOCALAPPDATA 'LDFCL/game').Replace('/', '\')) { throw "Wrong fresh game directory: $fresh" }
            $install = Start-Process (Join-Path $PWD.Path $setup) -ArgumentList ($setupArgs + ('/GAMEFOLDER="{0}"' -f $previous)) -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "Reuse installation exited with code $($install.ExitCode)" }
            if ((Get-ItemProperty $registry).gameDirectory -ne $gameRoot) { throw 'Installer did not store the selected .minecraft directory' }
            $rootFiles = (Get-ChildItem $appRoot -File | Sort-Object Name).Name -join ','
            if ($rootFiles -ne 'LDFCL.exe,Uninstall.exe') { throw "Unexpected files in install root: $rootFiles" }
            $versions = & (Join-Path $appRoot 'runtime/bin/ldfcl-cli.exe') list --game-dir $gameRoot
            if ($LASTEXITCODE -ne 0 -or $versions -ne 'fixture') { throw 'Installed launcher did not discover the reused version' }
            $env:QT_QPA_PLATFORM = 'windows'
            $env:QT_QUICK_BACKEND = 'software'
            $entry = Start-Process (Join-Path $appRoot 'LDFCL.exe') -PassThru
            if (-not $entry.WaitForExit(5000) -or $entry.ExitCode -ne 0) { throw 'Installed launcher entry failed to start the GUI' }
            Start-Sleep -Seconds 3
            $runtimeGui = Join-Path $appRoot 'runtime\bin\LDFCL.exe'
            $app = Get-Process -Name LDFCL | Where-Object { $_.Path -eq $runtimeGui } | Select-Object -First 1
            if (-not $app) { throw 'Installed GUI process did not start' }
            Stop-Process -Id $app.Id
            $result = Start-Process (Join-Path $appRoot 'Uninstall.exe') -ArgumentList '/VERYSILENT', '/NORESTART' -Wait -PassThru
            if ($result.ExitCode -ne 0 -or (Test-Path (Join-Path $appRoot 'LDFCL.exe')) -or -not (Test-Path (Join-Path $fixtureVersion 'fixture.jar'))) {
              throw 'Uninstall failed or modified the imported game folder'
            }
            $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
            Set-Content -Encoding ascii "${setup}.sha256" "$hash  $setup"
          } catch {
            $detail = $_.Exception.Message -replace '\r?\n', '%0A'
            Write-Host "::error title=Build and verify Windows installer::$detail"
            exit 1
          }

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = "LDFCL-${env:RELEASE_TAG}-Windows-x64-Setup.exe"
          gh release view $env:RELEASE_TAG --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          gh release create $env:RELEASE_TAG $setup "${setup}.sha256" --verify-tag --prerelease --title "LDFCL ${env:RELEASE_TAG}" --notes "Windows x64 安装程序。可全新安装，或选择 PCL／HMCL 的游戏目录，直接使用已有版本与存档。"
