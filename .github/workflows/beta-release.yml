name: Publish beta release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing beta tag to package
        required: true
        type: string
  push:
    tags:
      - 'beta[0-9]*'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  SETUP_SUFFIX: ${{ (inputs.release_tag || github.ref_name) == 'beta1.0.1' && 'Bilingual-Setup' || 'Setup' }}

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Build and publish Windows x64
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: release-tools
          sparse-checkout: packaging
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64

      - name: Build and test
        run: |
          function Invoke-ReleaseCheck($label, $tool, $arguments) {
            $output = & $tool @arguments 2>&1
            $code = $LASTEXITCODE
            $output | ForEach-Object { Write-Host $_ }
            if ($code -ne 0) {
              $detail = ($output | Select-Object -Last 24) -join '%0A'
              Write-Host "::error title=${label}::$detail"
              exit $code
            }
          }
          Invoke-ReleaseCheck 'Configure Windows' cmake @('-S', '.', '-B', 'out', '-G', 'Visual Studio 17 2022', '-A', 'x64', "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR")
          Invoke-ReleaseCheck 'Compile Windows' cmake @('--build', 'out', '--config', 'Release', '--parallel', '2')
          Invoke-ReleaseCheck 'Test Windows' ctest @('--test-dir', 'out', '-C', 'Release', '--output-on-failure')

      - name: Stage and verify Windows package
        run: |
          try {
            $PSNativeCommandUseErrorActionPreference = $false
            $packageRoot = Join-Path $PWD.Path 'package'
            $output = & cmake --install out --config Release --prefix $packageRoot 2>&1
            $code = $LASTEXITCODE
            $output | ForEach-Object { Write-Host $_ }
            if ($code -ne 0) { throw (($output | Select-Object -Last 22) -join '%0A') }
            Copy-Item out/Release/ldfcl-cli.exe package/bin/
            Copy-Item README.md,LICENSE package/
            Copy-Item out/_deps/nlohmann_json-src/LICENSE.MIT package/share/licenses/LDFCL/nlohmann-json-LICENSE
            Copy-Item out/_deps/miniz-src/LICENSE package/share/licenses/LDFCL/miniz-LICENSE
            Copy-Item docs/Qt-LGPL.md package/share/licenses/LDFCL/
            Copy-Item docs/licenses/*.txt package/share/licenses/LDFCL/
            foreach ($file in 'LDFCL.exe', 'Qt6Core.dll', 'qwindows.dll') {
              if (-not (Get-ChildItem package -Recurse -File -Filter $file)) {
                throw "Missing deployment file: $file"
              }
            }
          } catch {
            $detail = $_.Exception.Message -replace '\r?\n', '%0A'
            Write-Host "::error title=Stage Windows package::$detail"
            exit 1
          }

      - name: Compile and test the Windows installer
        run: |
          try {
            $packageRoot = Join-Path $PWD.Path 'package'
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
            $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            $redist = Get-ChildItem (Join-Path $vs 'VC/Redist/MSVC') -Directory |
              ForEach-Object { Join-Path $_.FullName 'x64/Microsoft.VC143.CRT' } |
              Where-Object { Test-Path $_ } | Sort-Object -Descending | Select-Object -First 1
            if (-not $redist) { throw 'Visual C++ runtime redistributables are missing' }
            Copy-Item "$redist/*.dll" package/bin/
            $compilerInstaller = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
            $compilerDirectory = Join-Path $env:RUNNER_TEMP 'Inno Setup 6.7.4'
            $chineseMessages = Join-Path $env:RUNNER_TEMP 'ChineseSimplified.isl'
            Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $compilerInstaller
            Invoke-WebRequest 'https://raw.githubusercontent.com/jrsoftware/issrc/c2913c993858a781fcb455bac8b8949c1c366cb8/Files/Languages/Unofficial/ChineseSimplified.isl' -OutFile $chineseMessages
            if ((Get-FileHash $compilerInstaller).Hash -ne 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c' -or
                (Get-FileHash $chineseMessages).Hash -ne '7d544b9bb1d142cfa11f2e5d3cc8abe2e55f8e066c5124e3772675aa236e1278') {
              throw 'Inno Setup or its Simplified Chinese messages failed checksum verification'
            }
            $compiler = Start-Process $compilerInstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="{0}"' -f $compilerDirectory) -Wait -PassThru
            if ($compiler.ExitCode -ne 0) { throw "Inno Setup installation exited with code $($compiler.ExitCode)" }
            $iscc = Join-Path $compilerDirectory 'ISCC.exe'
            $PSNativeCommandUseErrorActionPreference = $true
            cmake -S release-tools/packaging -B entries -G "Visual Studio 17 2022" -A x64
            cmake --build entries --config Release --parallel 2
            $PSNativeCommandUseErrorActionPreference = $false
            $entryRoot = Join-Path $PWD.Path 'entries/Release'
            $setupBase = "LDFCL-${env:RELEASE_TAG}-Windows-x64-${env:SETUP_SUFFIX}"
            $output = & $iscc "/DReleaseTag=$env:RELEASE_TAG" "/DSourceRoot=$packageRoot" "/DEntryRoot=$entryRoot" "/DSetupBasename=$setupBase" "/DOutputRoot=$($PWD.Path)" "/DChineseMessages=$chineseMessages" release-tools/packaging/LDFCL.iss 2>&1
            $code = $LASTEXITCODE
            $output | ForEach-Object { Write-Host $_ }
            if ($code -ne 0) { throw (($output | Select-Object -Last 24) -join '%0A') }

            $setup = "LDFCL-${env:RELEASE_TAG}-Windows-x64-${env:SETUP_SUFFIX}.exe"
            $appRoot = Join-Path $env:RUNNER_TEMP 'LDFCL Install Test'
            $previous = Join-Path $env:RUNNER_TEMP 'PCL Fixture'
            $gameRoot = Join-Path $previous '.minecraft'
            New-Item (Join-Path $gameRoot 'versions') -ItemType Directory -Force | Out-Null
            $registry = 'HKCU:\Software\LDFCL\LDFCL'
            $fixtureVersion = Join-Path $gameRoot 'versions/fixture'
            New-Item $fixtureVersion -ItemType Directory -Force | Out-Null
            Set-Content (Join-Path $fixtureVersion 'fixture.json') -Encoding ascii '{"mainClass":"fixture.Main","libraries":[]}'
            Set-Content (Join-Path $fixtureVersion 'fixture.jar') -Encoding ascii 'Fixture client'
            $setupArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="{0}"' -f $appRoot))
            $legacySetup = Join-Path $env:RUNNER_TEMP 'LDFCL-beta1.0.1-Windows-x64-Setup.exe'
            Invoke-WebRequest 'https://github.com/KaMuMom/LDFCL/releases/download/beta1.0.1/LDFCL-beta1.0.1-Windows-x64-Setup.exe' -OutFile $legacySetup
            if ((Get-FileHash $legacySetup).Hash -ne '7fe14df6373bf93c6eb3d73b738f76906e8d6802e25f26cb4465617f26ad125f') { throw 'Legacy installer failed checksum verification' }
            $install = Start-Process $legacySetup -ArgumentList ($setupArgs + ('/GAMEFOLDER="{0}"' -f $previous)) -Wait -PassThru
            if ($install.ExitCode -ne 0 -or -not (Test-Path (Join-Path $appRoot 'bin/LDFCL.exe'))) { throw 'Could not reproduce the legacy bin layout' }

            $chineseLog = Join-Path $env:RUNNER_TEMP 'ldfcl-zhcn-install.log'
            $install = Start-Process (Join-Path $PWD.Path $setup) -ArgumentList ($setupArgs + '/LANG=zhcn' + ('/LOG="{0}"' -f $chineseLog)) -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw ((Get-Content $chineseLog -Tail 12) -join '%0A') }
            if (-not (Select-String -Path $chineseLog -Pattern 'LDFCL installer language: zhcn' -SimpleMatch -Quiet)) { throw 'Simplified Chinese was not selected' }
            if ((Get-ItemProperty $registry).gameDirectory -ne $gameRoot) { throw 'Upgrade did not keep the selected .minecraft directory' }
            $rootItems = (Get-ChildItem $appRoot -Force | Sort-Object Name).Name -join ','
            if ($rootItems -ne 'LDFCL.exe,runtime,Uninstall.exe') { throw "Unexpected contents in install root after upgrade: $rootItems" }
            if ((Get-Content (Join-Path $appRoot 'runtime/LICENSE.zh-CN.txt') -Raw) -notmatch 'MIT 许可证') { throw 'The Chinese license notice was not installed correctly' }
            $versions = & (Join-Path $appRoot 'runtime/bin/ldfcl-cli.exe') list --game-dir $gameRoot
            if ($LASTEXITCODE -ne 0 -or $versions -ne 'fixture') { throw 'Installed launcher did not discover the reused version' }
            $env:QT_QPA_PLATFORM = 'windows'
            $env:QT_QUICK_BACKEND = 'software'
            $entry = Start-Process (Join-Path $appRoot 'LDFCL.exe') -PassThru
            if (-not $entry.WaitForExit(5000) -or $entry.ExitCode -ne 0) { throw 'Installed launcher entry failed to start the GUI' }
            Start-Sleep -Seconds 3
            $runtimeGui = Join-Path $appRoot 'runtime\bin\LDFCL.exe'
            $app = Get-Process -Name LDFCL | Where-Object { $_.Path -eq $runtimeGui } | Select-Object -First 1
            if (-not $app) { throw 'Installed GUI process did not start' }
            Stop-Process -Id $app.Id
            if (-not $app.WaitForExit(5000)) { throw 'The installed GUI did not exit' }
            $result = Start-Process (Join-Path $appRoot 'Uninstall.exe') -ArgumentList '/VERYSILENT', '/NORESTART' -Wait -PassThru
            if ($result.ExitCode -ne 0 -or (Test-Path (Join-Path $appRoot 'LDFCL.exe')) -or -not (Test-Path (Join-Path $fixtureVersion 'fixture.jar'))) {
              throw 'Uninstall failed or modified the imported game folder'
            }

            Remove-ItemProperty -Path $registry -Name gameDirectory
            $englishLog = Join-Path $env:RUNNER_TEMP 'ldfcl-en-install.log'
            $install = Start-Process (Join-Path $PWD.Path $setup) -ArgumentList ($setupArgs + '/LANG=en' + ('/LOG="{0}"' -f $englishLog)) -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw ((Get-Content $englishLog -Tail 12) -join '%0A') }
            if (-not (Select-String -Path $englishLog -Pattern 'LDFCL installer language: en' -SimpleMatch -Quiet)) { throw 'English was not selected' }
            $fresh = (Get-ItemProperty $registry).gameDirectory
            if ($fresh -ne (Join-Path $env:LOCALAPPDATA 'LDFCL/game').Replace('/', '\')) { throw "Wrong fresh game directory: $fresh" }
            $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
            Set-Content -Encoding ascii "${setup}.sha256" "$hash  $setup"
          } catch {
            $detail = $_.Exception.Message -replace '\r?\n', '%0A'
            Write-Host "::error title=Build and verify Windows installer::$detail"
            exit 1
          }

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = "LDFCL-${env:RELEASE_TAG}-Windows-x64-${env:SETUP_SUFFIX}.exe"
          $release = gh release view $env:RELEASE_TAG --json body,assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $published = $release | ConvertFrom-Json
            $known = @($published.assets | ForEach-Object { $_.name })
            $missing = @($setup, "${setup}.sha256") | Where-Object { $_ -notin $known }
            if ($missing) {
              gh release upload $env:RELEASE_TAG @missing
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            if ($published.body -notlike "*$setup*") {
              $download = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$setup"
              $oldRecommendation = '建议下载 LDFCL-beta1.0.1-Windows-x64-Clean-Setup.exe。安装目录顶层放置 LDFCL.exe 和 Uninstall.exe，运行文件收在 runtime。'
              $previousNotes = $published.body.Replace($oldRecommendation, '').Trim()
              $notes = "推荐下载 [双语安装程序]($download)。安装向导支持简体中文和英文。安装后从根目录运行 LDFCL.exe。`n`n$previousNotes"
              Set-Content -Encoding utf8 release-notes.txt $notes
              gh release edit $env:RELEASE_TAG --notes-file release-notes.txt
            }
            exit $LASTEXITCODE
          }
          gh release create $env:RELEASE_TAG $setup "${setup}.sha256" --verify-tag --prerelease --title "LDFCL ${env:RELEASE_TAG}" --notes "Windows x64 安装程序支持简体中文和英文。可全新安装，也可沿用 PCL／HMCL 的游戏目录、版本和存档。安装后从根目录运行 LDFCL.exe。"
